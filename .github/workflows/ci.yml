name: ci

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  build-and-test:
    name: 构建与测试
    runs-on: ubuntu-latest

    # 最小权限：默认令牌权限很宽，这里显式收窄到这条流水线真正需要的两项。
    # `issues: read` 是给 GitHub 后端的票据检查用的（ADR-0016）——
    # runner 上 gh 是预装的，但没有登录态，靠 GH_TOKEN 顶上。
    permissions:
      contents: read
      issues: read

    steps:
      # Node 24 的首个大版本（v4 系列跑在 Node 20 上，runner 已在强制升到 24 并给出弃用提示）。
      # v5 之后的破坏性变更只涉及 `pull_request_target` 的检出安全性，本仓不用那个触发器。
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: 还原
        run: dotnet restore NexusStackNext.slnx

      - name: 构建
        # TreatWarningsAsErrors 已打开，因此这一步同时是"没有坏味道"的检查。
        run: dotnet build NexusStackNext.slnx --no-restore --configuration Release

      - name: 测试
        # 含 Architecture.Tests —— 把 AGENTS.md 的八条不变量变成会失败的断言。
        run: dotnet test NexusStackNext.slnx --no-build --configuration Release

      - name: 断言格式符合 .editorconfig
        # typecheck（构建）→ tests → format：`resolving-merge-conflicts` 要求的三段自动化检查。
        # 第一次跑它的时候全仓有 448 处违规而构建全绿——"声明了风格"与"检查了风格"是两件事。
        shell: pwsh
        run: ./scripts/check-format.ps1

      - name: 断言模板生成物不含凭据
        # 见票据 16：参照仓库把生产凭据随模板分发了出去。
        shell: pwsh
        run: ./scripts/assert-no-credentials.ps1

      - name: 断言跟踪器与规范一致
        # 见票据 28/29：一句关于"我们做了什么"的声明，如果不受检查，就会变成谎话。
        # 这条检查第一次运行就抓到了一张自相矛盾的票据（状态 resolved、依赖未解决）。
        #
        # 两个脚本分工是"跟着后端声明走"（ADR-0016）：check-tracker 管仓库侧的契约
        # （上下文规范 / slnx / 指针 / ADR / 评审编号 / spec），check-issues 管
        # **GitHub 侧的票据形状**（地图唯一、票据挂在地图下、阻塞边指向真实存在的票、标签与调色盘一致）。
        # 后者要读 issue，所以给它 workflow 自己的令牌。
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/check-tracker.ps1
          ./scripts/check-issues.ps1

      - name: 断言模板能生成可构建的工程
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hive = Join-Path ([System.IO.Path]::GetTempPath()) 'nsn-ci-hive'
          $out  = Join-Path ([System.IO.Path]::GetTempPath()) 'nsn-ci-gen'
          Remove-Item $hive, $out -Recurse -Force -ErrorAction SilentlyContinue
          dotnet new install . --debug:custom-hive $hive
          dotnet new nexusstack-next -n CiProbe -o $out --debug:custom-hive $hive
          dotnet build "$out/CiProbe.slnx" --configuration Release
