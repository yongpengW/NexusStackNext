name: ci

on:
  push:
    # **main 与 dev 都跑 CI**（2026-09-30 定）。公开仓库的 Actions 不计费，
    # 而 CI 是**唯一的"平台差异"检查**（Linux / 干净检出）——这一轮它就抓到过
    # "路径正则只认 Windows 反斜杠、本机永远绿而 ubuntu 上冤枉五个上下文"。
    # 所以 dev 上的直推也过 CI：坏提交**立刻**看到红，而不是攒到 dev → main 的 PR。
    branches: [ main, dev ]
  pull_request:
  # 手动触发同一套完整检查。
  workflow_dispatch:

# **并发取消**：连推几次时只跑最后一次 —— 不改变"每个 PR 都得到一次完整检查"这条保证，
# 只省掉被取代的运行。
#
# **刻意不加路径过滤**：纯文档 PR 一旦不触发运行，`main` 要求的必需检查 `构建与测试`
# 就永远不上报，PR 会卡在 BLOCKED 合不了。要过滤得先做成"总是报到的轻量 job + 按路径跑的重活 job"。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-shards:
    name: 隔离测试 / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]

    # 每次运行专属的空库，端口仅绑定 runner 本机。trust 只用于这个临时测试容器。
    services:
      redis:
        # 本次运行专属的普通缓存；只向 runner 回环地址发布端口。
        image: redis:7.2.14
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # 测试分组只需读取代码；票据权限仅授予最后的汇总任务。
    permissions:
      contents: read

    steps:
      # Node 24 的首个大版本（v4 系列跑在 Node 20 上，runner 已在强制升到 24 并给出弃用提示）。
      # v5 之后的破坏性变更只涉及 `pull_request_target` 的检出安全性，本仓不用那个触发器。
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # HTTP 大整数必须经过真正的 JavaScript JSON.parse / stringify 验证。
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 还原
        run: dotnet restore NexusStackNext.slnx

      - name: 构建
        # TreatWarningsAsErrors 已打开，因此这一步同时是"没有坏味道"的检查。
        run: dotnet build NexusStackNext.slnx --no-restore --configuration Release

      - name: 测试
        # 每台 runner 独占依赖，组内仍串行；本机共享数据库不启用此模式。
        shell: pwsh
        env:
          NSN_CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          NSN_CI_REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          $connection = [System.Data.Common.DbConnectionStringBuilder]::new()
          $connection['Host'] = '127.0.0.1'
          $connection['Port'] = 5432
          $connection['Database'] = 'postgres'
          $connection['Username'] = 'postgres'
          $env:NEXUSSTACK_TEST_POSTGRES = $connection.ConnectionString
          $env:NEXUSSTACK_TEST_REDIS = '127.0.0.1:6379'
          # 此运行专属的 broker，随机凭据只经环境传给容器与测试，不进入命令参数。
          $env:RABBITMQ_DEFAULT_USER = 'nsn-ci'
          $env:RABBITMQ_DEFAULT_PASS = [Convert]::ToBase64String([System.Security.Cryptography.RandomNumberGenerator]::GetBytes(24))
          Write-Output "::add-mask::$env:RABBITMQ_DEFAULT_PASS"
          $env:NSN_CI_RABBIT_CONTAINER = docker run --detach --name nsn-ci-rabbit --env RABBITMQ_DEFAULT_USER --env RABBITMQ_DEFAULT_PASS --publish 127.0.0.1:5672:5672 --publish 127.0.0.1:15672:15672 --health-cmd 'rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity' --health-interval 5s --health-timeout 10s --health-retries 12 rabbitmq:4-management
          if ($LASTEXITCODE -ne 0) { throw 'RabbitMQ container startup failed.' }
          $ready = $false
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            $health = docker inspect --format '{{.State.Health.Status}}' nsn-ci-rabbit
            if ($health -eq 'healthy') { $ready = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) { throw 'RabbitMQ was not ready.' }
          $env:NEXUSSTACK_TEST_RABBITMQ = @{ HostName = '127.0.0.1'; Port = 5672; UserName = $env:RABBITMQ_DEFAULT_USER; Password = $env:RABBITMQ_DEFAULT_PASS; VirtualHost = '/' } | ConvertTo-Json -Compress
          ./scripts/run-tests.ps1 -Configuration Release -NoBuild -CiShard ${{ matrix.shard }} -ReportDirectory (Join-Path $env:RUNNER_TEMP 'nsn-ci-reports')
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        with:
          name: ci-tests-${{ matrix.shard }}
          path: ${{ runner.temp }}/nsn-ci-reports/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  build-and-test:
    # Preserve the existing required check name. Missing/failed/cancelled shards fail this gate.
    name: 构建与测试
    needs: test-shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      - name: 确认所有分组完成
        shell: pwsh
        env:
          SHARD_RESULT: ${{ needs.test-shards.result }}
        run: |
          if ($env:SHARD_RESULT -ne 'success') { throw 'One or more test shards did not succeed.' }

      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-tests-*
          path: ${{ runner.temp }}/nsn-ci-reports

      - name: 核对全部测试完整执行
        shell: pwsh
        run: ./scripts/ci-test-tools.ps1 -Action Verify -InputPath (Join-Path $env:RUNNER_TEMP 'nsn-ci-reports') -Revision $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID -Attempt $env:GITHUB_RUN_ATTEMPT

      - name: 验证分组与安全护栏
        shell: pwsh
        run: ./scripts/check-ci-tests.ps1

      - name: 验证票据读取失败门禁
        shell: pwsh
        run: ./scripts/check-issue-fetching.ps1

      - name: 还原格式检查所需依赖
        run: dotnet restore NexusStackNext.slnx
      - name: 断言格式符合 .editorconfig
        # typecheck（构建）→ tests → format：`resolving-merge-conflicts` 要求的三段自动化检查。
        # 第一次跑它的时候全仓有 448 处违规而构建全绿——"声明了风格"与"检查了风格"是两件事。
        shell: pwsh
        run: ./scripts/check-format.ps1

      - name: 断言模板生成物不含凭据
        # 见票据 16：参照仓库把生产凭据随模板分发了出去。
        shell: pwsh
        run: ./scripts/assert-no-credentials.ps1

      - name: 断言仓库跟踪器与规范一致
        # 见票据 28/29：一句关于"我们做了什么"的声明，如果不受检查，就会变成谎话。
        # 这条检查第一次运行就抓到了一张自相矛盾的票据（状态 resolved、依赖未解决）。
        #
        # 两个脚本分工是"跟着后端声明走"（ADR-0016）：check-tracker 管仓库侧的契约
        # （上下文规范 / slnx / 指针 / ADR / 评审编号 / spec），check-issues 管
        # **GitHub 侧的票据形状**（地图唯一、票据挂在地图下、阻塞边指向真实存在的票、标签与调色盘一致）。
        # 后者要读 issue，所以给它 workflow 自己的令牌。
        shell: pwsh
        run: ./scripts/check-tracker.ps1

      - name: 断言 GitHub 票据一致
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-issues.ps1

      - name: 断言模板能生成可构建的工程
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probeId = [Guid]::NewGuid().ToString('N')
          $hive = Join-Path ([System.IO.Path]::GetTempPath()) "nsn-ci-hive-$probeId"
          $out  = Join-Path ([System.IO.Path]::GetTempPath()) "nsn-ci-gen-$probeId"
          dotnet new install . --debug:custom-hive $hive
          if ($LASTEXITCODE -ne 0) { throw 'Template installation failed.' }
          dotnet new nexusstack-next -n CiProbe -o $out --debug:custom-hive $hive
          if ($LASTEXITCODE -ne 0) { throw 'Template generation failed.' }
          dotnet build "$out/CiProbe.slnx" --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Generated project build failed.' }
